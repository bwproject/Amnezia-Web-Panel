name: Sync main with upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - imp

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-main-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Check PRVTPRO upstream and refresh main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ProjectBW main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare and merge upstream main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/PRVTPRO/Amnezia-Web-Panel.git
          git fetch upstream main
          upstream_head="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor "$upstream_head" HEAD; then
            echo "main already contains latest upstream commit: $upstream_head"
          else
            git merge --no-edit upstream/main
            git push origin HEAD:main
            echo "main updated with upstream commit $upstream_head"
          fi

      - name: Trigger overlay assembly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-bw.yml --repo bwproject/Amnezia-Web-Panel --ref imp
