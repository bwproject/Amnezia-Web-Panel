name: Validate BW integration

on:
  push:
    branches:
      - BW
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BW branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrated Python modules
        run: |
          python -m py_compile \
            app.py \
            exit_link_service.py \
            smartroute_service.py \
            telegram_bot.py \
            telegram_exit_transport.py \
            bw_exit_manager.py \
            bw_wg_awg_transport.py \
            managers/wireguard_exit_manager.py
