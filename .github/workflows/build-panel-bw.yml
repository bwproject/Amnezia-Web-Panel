name: Build Panel BW

on:
  push:
    branches:
      - BW
    paths:
      - '**.py'
      - 'managers/**'
      - 'templates/**'
      - 'static/**'
      - 'translations/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/build-panel-bw.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bwproject/amnezia-panel-bw

jobs:
  build:
    name: Validate and build Amnezia Panel BW
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BW 1.8.9
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile BW integration modules
        run: |
          python -m py_compile \
            app.py \
            exit_link_service.py \
            smartroute_service.py \
            telegram_bot.py \
            telegram_exit_transport.py \
            bw_exit_manager.py \
            bw_wg_awg_transport.py \
            managers/wireguard_exit_manager.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push amnezia-panel-bw
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
