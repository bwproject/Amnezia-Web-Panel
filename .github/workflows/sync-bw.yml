name: Assemble BW from main + imp

on:
  push:
    branches:
      - imp
    paths:
      - '**.py'
      - 'managers/**'
      - 'protocol_telemt/**'
      - 'patches/**'
      - 'BW-OVERLAY.md'
      - '.github/workflows/sync-bw.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: assemble-bw
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/bwproject/amnezia-panel-bw

jobs:
  assemble:
    name: Apply imp patches to upstream and update BW
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout upstream main
        uses: actions/checkout@v4
        with:
          ref: main
          path: upstream

      - name: Checkout ProjectBW overlay
        uses: actions/checkout@v4
        with:
          ref: imp
          path: overlay

      - name: Apply ProjectBW modules and patches
        shell: bash
        run: |
          set -euo pipefail

          install -D overlay/bw_exit_manager.py upstream/bw_exit_manager.py
          install -D overlay/bw_wg_awg_transport.py upstream/bw_wg_awg_transport.py
          install -D overlay/telegram_exit_transport.py upstream/telegram_exit_transport.py
          install -D overlay/telemt_exit_service.py upstream/telemt_exit_service.py
          if [ -d overlay/protocol_telemt ]; then
            rm -rf upstream/protocol_telemt
            cp -a overlay/protocol_telemt upstream/protocol_telemt
          fi
          install -D overlay/managers/wireguard_exit_manager.py upstream/managers/wireguard_exit_manager.py
          install -D overlay/managers/http_proxy_manager.py upstream/managers/http_proxy_manager.py

          shopt -s nullglob
          patches=(overlay/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No integration patches found"
            exit 1
          fi

          for patch in "${patches[@]}"; do
            echo "::group::Check ${patch}"
            git -C upstream apply --check "$GITHUB_WORKSPACE/$patch"
            git -C upstream apply "$GITHUB_WORKSPACE/$patch"
            echo "::endgroup::"
          done

          git -C upstream diff --check

      - name: Validate Python integration
        run: |
          python -m py_compile \
            upstream/app.py \
            upstream/exit_link_service.py \
            upstream/smartroute_service.py \
            upstream/telegram_bot.py \
            upstream/telegram_exit_transport.py \
            upstream/telemt_exit_service.py \
            upstream/bw_exit_manager.py \
            upstream/bw_wg_awg_transport.py \
            upstream/managers/http_proxy_manager.py \
            upstream/managers/wireguard_exit_manager.py

      - name: Checkout generated BW branch
        uses: actions/checkout@v4
        with:
          ref: BW
          path: bw

      - name: Update BW with assembled source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' upstream/ bw/
          cd bw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "BW already matches main + imp"
          else
            git commit -m "Build BW from main + imp"
            git push origin HEAD:BW
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and publish BW image
        uses: docker/build-push-action@v6
        with:
          context: ./bw
          file: ./bw/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Upstream refresh: rebuild against v1.8.11.
